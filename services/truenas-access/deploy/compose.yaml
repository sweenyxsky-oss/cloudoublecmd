# TrueNAS Custom App YAML (Apps → Discover → ⋮ → Install via YAML).
# Replace every "tank" with your pool name. Add one volume line per extra pool.
# Never expose this port to the internet; use a VPN or HTTPS reverse proxy for remote access.
services:
  commander:
    image: ghcr.io/sweenyxsky-oss/cloudoublecmd:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "7080:7070"
    environment:
      PORT: "7070"
      UI_PASSWORD_FILE: /run/secrets/ui_password
      ACCESS_TOKEN_FILE: /run/secrets/access_token
      CONNECTIONS_FILE: /run/secrets/connections.json
    volumes:
      # App settings (read-only on purpose: these are secrets, not your files).
      - /mnt/tank/cloudoublecmd/config/access_token:/run/secrets/access_token:ro
      - /mnt/tank/cloudoublecmd/config/ui_password:/run/secrets/ui_password:ro
      - /mnt/tank/cloudoublecmd/config/connections.json:/run/secrets/connections.json:ro
      # Your data: whole pools, read-write. Add one line per pool, e.g.
      # - /mnt/fast:/data/fast
      - /mnt/tank:/data/tank
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
